<!DOCTYPE html>
<!--
  nhzterm reference UI (§10).

  xterm.js is the renderer (§10.1). It is loaded from assets, never a CDN —
  the daemon has no web dependency and neither should the client at runtime.
  Drop xterm.js + xterm.css beside this file in assets/.

  Links are deliberately NOT auto-clickable (§10.2): no addon-web-links. The
  long-press menu owns that flow instead, matching Termux's interaction model.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #282a36; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #term { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  body.keys-visible #term { bottom: 88px; }

  /* ---- Extra keys, two rows (§10.6) ---- */
  #extrakeys {
    position: absolute; left: 0; right: 0; bottom: 0; height: 88px;
    display: none; flex-direction: column; justify-content: center;
    background: #21222c; border-top: 1px solid #44475a;
  }
  body.keys-visible #extrakeys { display: flex; }
  .keyrow { display: flex; justify-content: space-around; padding: 3px 2px; }
  .key {
    flex: 1; margin: 0 2px; padding: 9px 0;
    background: #44475a; color: #f8f8f2;
    border-radius: 5px; text-align: center;
    font: 13px/1 monospace; min-width: 0;
  }
  .key:active, .key.latched { background: #6272a4; }
  .key.latched { box-shadow: inset 0 0 0 1px #bd93f9; }

  /* ---- Long-press context menu (§10.3) ---- */
  #menu, #submenu {
    position: absolute; display: none; z-index: 30;
    background: #21222c; border: 1px solid #44475a; border-radius: 8px;
    min-width: 180px; padding: 4px 0;
    box-shadow: 0 6px 24px rgba(0,0,0,.6);
  }
  .mi { padding: 11px 18px; color: #f8f8f2; font: 14px sans-serif; }
  .mi:active { background: #44475a; }
  .mi.disabled { color: #6272a4; }

  #overlay {
    position: absolute; inset: 0; z-index: 20; display: none;
  }
  #overlay.on { display: block; }

  /* ---- Session side panel (§10.4) ----
     Required, not polish: without a visible "+" there is no way to create a
     session once the last one closes, and the terminal has nothing to attach
     to. That is exactly what the real-device test hit. */
  #drawer {
    position: absolute; top: 0; bottom: 0; left: 0; width: 262px; z-index: 50;
    background: #21222c; border-right: 1px solid #44475a;
    transform: translateX(-100%); transition: transform .18s ease-out;
    display: flex; flex-direction: column;
  }
  #drawer.on { transform: translateX(0); }
  #drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 14px; border-bottom: 1px solid #44475a;
    color: #bd93f9; font: 600 13px sans-serif; letter-spacing: .5px;
  }
  #new-session {
    background: #50fa7b; color: #21222c; border-radius: 6px;
    padding: 5px 13px; font: 700 16px/1 sans-serif;
  }
  #new-session:active { background: #3ddc6b; }
  #session-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  .srow {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 14px; color: #f8f8f2; font: 13px sans-serif;
  }
  .srow.active { background: #44475a; }
  .srow:active { background: #3b3d4f; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
  .dot.running  { background: #50fa7b; }
  .dot.idle     { background: #f1fa8c; }
  .dot.finished { background: #6272a4; }
  .sname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sx { color: #6272a4; padding: 0 4px; font-size: 16px; }
  .sx:active { color: #ff5555; }
  #drawer-empty { padding: 22px 16px; color: #6272a4; font: 13px sans-serif; text-align: center; }
  #drawer-scrim {
    position: absolute; inset: 0; z-index: 45; background: rgba(0,0,0,.5);
    display: none;
  }
  #drawer-scrim.on { display: block; }

  /* Hamburger — the always-reachable way back to the panel. */
  #menu-btn {
    position: absolute; top: 0; left: 0; z-index: 15;
    padding: 9px 14px; color: #6272a4; font-size: 17px;
    background: rgba(33,34,44,.82); border-bottom-right-radius: 8px;
  }
  #menu-btn:active { color: #f8f8f2; }

  /* ---- Style picker (§11) ---- */
  #styler {
    position: absolute; inset: 24px; z-index: 40; display: none;
    background: #21222c; border: 1px solid #44475a; border-radius: 10px;
    color: #f8f8f2; font: 14px sans-serif; overflow: auto; padding: 14px;
  }
  #styler.on { display: block; }
  #styler h3 { margin: 10px 0 6px; font-size: 13px; color: #bd93f9; }
  .opt { padding: 9px 8px; border-radius: 6px; }
  .opt.sel { background: #44475a; }
  #styler .close { float: right; padding: 4px 10px; background: #44475a; border-radius: 6px; }
</style>
</head>
<body>
<div id="term"></div>
<div id="menu-btn">&#9776;</div>
<div id="overlay"></div>

<div id="drawer-scrim"></div>
<div id="drawer">
  <div id="drawer-head">
    <span>SESSIONS</span>
    <span id="new-session">+</span>
  </div>
  <div id="session-list"></div>
  <div id="drawer-empty">No sessions.<br>Tap + to start one.</div>
</div>

<div id="extrakeys">
  <div class="keyrow">
    <div class="key" data-k="ESC">ESC</div>
    <div class="key" data-k="TAB">TAB</div>
    <div class="key" data-k="CTRL">CTRL</div>
    <div class="key" data-k="ALT">ALT</div>
    <div class="key" data-k="HOME">HOME</div>
    <div class="key" data-k="UP">&#9650;</div>
    <div class="key" data-k="END">END</div>
  </div>
  <div class="keyrow">
    <div class="key" data-k="SLASH">/</div>
    <div class="key" data-k="DASH">-</div>
    <div class="key" data-k="PGUP">PGUP</div>
    <div class="key" data-k="PGDN">PGDN</div>
    <div class="key" data-k="LEFT">&#9664;</div>
    <div class="key" data-k="DOWN">&#9660;</div>
    <div class="key" data-k="RIGHT">&#9654;</div>
  </div>
</div>

<div id="menu">
  <div class="mi" data-a="copy">Copy</div>
  <div class="mi" data-a="paste">Paste</div>
  <div class="mi" data-a="open" id="mi-open">Open</div>
  <div class="mi" data-a="more">More &#8250;</div>
</div>

<div id="submenu">
  <div class="mi" data-a="openurl" id="mi-openurl">Open URL</div>
  <div class="mi" data-a="share">Share Selected Text</div>
  <div class="mi" data-a="refresh">Refresh</div>
  <div class="mi" data-a="kill">Kill Process (PID)</div>
  <div class="mi" data-a="style">Style</div>
  <div class="mi" data-a="screenon">Keep Screen On</div>
  <div class="mi" data-a="help">Help</div>
  <div class="mi" data-a="settings">Settings</div>
  <div class="mi" data-a="report">Report Issue</div>
</div>

<div id="styler">
  <span class="close" id="styler-close">Done</span>
  <h3>THEME</h3><div id="theme-list"></div>
  <h3>FONT</h3><div id="font-list"></div>
  <h3>SIZE</h3><div id="size-list"></div>
</div>

<script src="xterm.js"></script>
<script src="themes.js"></script>
<script src="app.js"></script>
</body>
</html>
